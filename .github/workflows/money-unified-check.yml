name: Money Unified Safety Check

on:
  pull_request:
    paths:
      - 'money-unified.js'
      - 'config.js'
      - '.github/workflows/money-unified-check.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check money-unified.js
      - name: Money calculation and method mapping
        shell: bash
        run: |
          node <<'NODE'
          const entries = [
            { type: 'in', method: 'cash', amount: 100 },
            { type: 'out', method: 'cash', amount: 100 },
            { type: 'in', method: 'bank', amount: 100 },
            { type: 'out', method: 'bank', amount: 100 },
          ];
          const total = (items) => {
            const income = items.filter(x => x.type === 'in').reduce((s, x) => s + x.amount, 0);
            const expense = items.filter(x => x.type === 'out').reduce((s, x) => s + x.amount, 0);
            return { income, expense, balance: income - expense };
          };
          const all = total(entries);
          const cash = total(entries.filter(x => x.method === 'cash'));
          const bank = total(entries.filter(x => x.method === 'bank'));
          if (all.income !== 200 || all.expense !== 200 || all.balance !== 0) throw new Error('Gesamt calculation failed');
          if (cash.income !== 100 || cash.expense !== 100 || cash.balance !== 0) throw new Error('Cash calculation failed');
          if (bank.income !== 100 || bank.expense !== 100 || bank.balance !== 0) throw new Error('Bank calculation failed');
          const map = { cash: 'bar', bank: 'bank', card: 'karte' };
          if (map.card !== 'karte') throw new Error('Card mapping failed');
          console.log('Money calculations passed:', { all, cash, bank, map });
          NODE
      - name: Original app remains untouched
        shell: bash
        run: |
          BASE_SHA='${{ github.event.pull_request.base.sha }}'
          git diff --name-only "$BASE_SHA"...HEAD
          test -z "$(git diff --name-only "$BASE_SHA"...HEAD -- index.html)"
