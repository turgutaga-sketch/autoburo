name: Web Direct Access Safe Check

on:
  push:
    branches:
      - agent/web-direktzugang-sicher
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: JavaScript syntax
        run: node --check web-direct-access-safe.js && node --check config.js

      - name: Static data safety
        shell: bash
        run: |
          ! grep -F "localStorage.removeItem('nwasb_buero_v1')" web-direct-access-safe.js
          ! grep -F 'S=defState()' web-direct-access-safe.js
          ! grep -F 'S = defState()' web-direct-access-safe.js
          grep -F "nwasb_buero_autosafe_backup_v1" config.js
          grep -F "web-direct-access-safe.js" config.js

      - name: Preflight backup keeps invoices and customers
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const store = new Map();
          const original = {
            settings: { name: 'Test Werkstatt' },
            customers: [{ id: 'c1', name: 'Kunde' }],
            vehicles: [],
            incomes: [],
            expenses: [],
            docs: [{ id: 'd1', no: 'RE-1' }],
            appointments: [], debts: [], files: [], parts: [], suppliers: []
          };
          store.set('nwasb_buero_v1', JSON.stringify(original));
          const document = {
            baseURI: 'https://autoburo.vercel.app/',
            head: { appendChild() {} },
            querySelector() { return null; },
            createElement() { return { dataset: {} }; }
          };
          const context = {
            window: null,
            location: { origin: 'https://autoburo.vercel.app' },
            localStorage: {
              getItem: (key) => store.has(key) ? store.get(key) : null,
              setItem: (key, value) => store.set(key, String(value)),
              removeItem: (key) => store.delete(key)
            },
            document,
            URL,
            console
          };
          context.window = context;
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('config.js', 'utf8'), context);
          const backup = JSON.parse(store.get('nwasb_buero_autosafe_backup_v1'));
          if (!backup || backup.data.docs.length !== 1 || backup.data.customers.length !== 1) {
            throw new Error('Preflight backup did not preserve business records');
          }
          if (store.get('nwasb_buero_v1') !== JSON.stringify(original)) {
            throw new Error('Original state was modified by preflight');
          }
          console.log('Preflight backup preserved all sample records.');
          NODE

      - name: Empty cloud start recovers data and opens dashboard
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const store = new Map();
          const session = new Map();
          const original = {
            settings: { users: [{ id: 'chef1', name: 'Chef', role: 'chef' }] },
            customers: [{ id: 'c1' }],
            vehicles: [{ id: 'v1' }],
            incomes: [], expenses: [],
            docs: [{ id: 'd1', no: 'RE-1' }],
            appointments: [], debts: [], files: [], parts: [], suppliers: []
          };
          store.set('nwasb_buero_v1', JSON.stringify(original));
          store.set('nwasb_buero_autosafe_backup_v1', JSON.stringify({ score: 3, data: original }));

          let removedLock = false;
          let openedPage = '';
          let pushed = 0;
          const nodes = {
            lock: { remove() { removedLock = true; delete nodes.lock; } }
          };
          const document = {
            readyState: 'complete',
            documentElement: {},
            getElementById(id) { return nodes[id] || null; },
            addEventListener() {}
          };
          class MutationObserver { constructor(cb) { this.cb = cb; } observe() {} }
          const context = {
            window: null,
            globalThis: null,
            document,
            MutationObserver,
            localStorage: {
              getItem: (key) => store.has(key) ? store.get(key) : null,
              setItem: (key, value) => store.set(key, String(value)),
              removeItem: (key) => store.delete(key)
            },
            sessionStorage: {
              getItem: (key) => session.has(key) ? session.get(key) : null,
              setItem: (key, value) => session.set(key, String(value)),
              removeItem: (key) => session.delete(key)
            },
            console,
            setInterval, clearInterval, setTimeout, clearTimeout
          };
          context.window = context;
          context.globalThis = context;
          vm.createContext(context);
          vm.runInContext(`
            let S = JSON.parse(localStorage.getItem('nwasb_buero_v1'));
            let AUTH = null;
            let ACC = { token: 'token', refresh: 'refresh', uid: 'u1', tenantId: null, email: 'chef@example.test' };
            let PAGE = 'start';
            function defState(){ return {settings:{users:[]},customers:[],vehicles:[],incomes:[],expenses:[],docs:[],appointments:[],debts:[],files:[],parts:[],suppliers:[]}; }
            function countOf(st){ return 0; }
            async function accRefresh(){ return true; }
            async function tenantOpen(){
              S = defState();
              localStorage.setItem('nwasb_buero_v1', JSON.stringify(S));
              ACC.tenantId = 'tenant1';
            }
            async function tenantPush(){ globalThis.__pushed = (globalThis.__pushed || 0) + 1; }
            function defaultPage(){ return 'start'; }
            function go(page){ globalThis.__openedPage = page; }
            function render(){}
          `, context);
          vm.runInContext(fs.readFileSync('web-direct-access-safe.js', 'utf8'), context);

          setTimeout(() => {
            const finalState = JSON.parse(store.get('nwasb_buero_v1'));
            if (finalState.docs.length !== 1 || finalState.customers.length !== 1 || finalState.vehicles.length !== 1) {
              throw new Error('Business data was not recovered after empty cloud start');
            }
            if (!removedLock) throw new Error('PIN layer was not removed for authenticated cloud account');
            if (context.__openedPage !== 'start') throw new Error('Dashboard was not opened');
            if (!context.__pushed) throw new Error('Recovered state was not queued for cloud save');
            console.log('Direct access recovered data and opened dashboard.');
          }, 450);
          setTimeout(() => process.exit(0), 550);
          NODE

      - name: Original app file remains untouched
        shell: bash
        run: |
          git fetch origin main --depth=1
          test -z "$(git diff --name-only origin/main...HEAD -- index.html)"
