name: Fix money amount parser

on:
  push:
    branches:
      - agent/geld-bereich-sicher

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/geld-bereich-sicher
          fetch-depth: 0

      - name: Fix amount parsing
        shell: python
        run: |
          from pathlib import Path
          path = Path('money-section.js')
          text = path.read_text(encoding='utf-8')
          old = """  const parseAmount = (value) => {
    const cleaned = String(value || '').trim().replace(/\\./g, '').replace(',', '.');
    return Number(cleaned);
  };"""
          new = """  const parseAmount = (value) => {
    let cleaned = String(value ?? '')
      .trim()
      .replace(/\\s/g, '')
      .replace(/€/g, '')
      .replace(/[^0-9,.-]/g, '');

    if (!cleaned) return Number.NaN;

    const germanThousands = /^-?\\d{1,3}(\\.\\d{3})+$/;
    const internationalThousands = /^-?\\d{1,3}(,\\d{3})+$/;

    if (germanThousands.test(cleaned)) {
      cleaned = cleaned.replace(/\\./g, '');
    } else if (internationalThousands.test(cleaned)) {
      cleaned = cleaned.replace(/,/g, '');
    } else {
      const comma = cleaned.lastIndexOf(',');
      const dot = cleaned.lastIndexOf('.');
      if (comma >= 0 && dot >= 0) {
        if (comma > dot) cleaned = cleaned.replace(/\\./g, '').replace(',', '.');
        else cleaned = cleaned.replace(/,/g, '');
      } else if (comma >= 0) {
        cleaned = cleaned.replace(',', '.');
      }
    }

    return Number(cleaned);
  };"""
          if old not in text:
              raise SystemExit('Expected parseAmount block not found; no file changed.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Validate JavaScript
        run: node --check money-section.js

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add money-section.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix money amount parsing"
          git push origin HEAD:agent/geld-bereich-sicher
