<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoBüro · Freigaben</title><style>:root{--navy:#1F2A4D;--gold:#C9A227;--bg:#f4f5f7;--line:#e5e7eb;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#111827}.wrap{max-width:920px;margin:auto;padding:24px}.head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:900}.logo{width:44px;height:44px;border-radius:14px;background:var(--navy);color:var(--gold);display:grid;place-items:center}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(15,23,42,.06);margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.meta{color:var(--muted);font-size:14px;line-height:1.5;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.ok{background:#166534;color:#fff}.no{background:#be123c;color:#fff}.soft{background:#e2e8f0;color:#334155}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#fef3c7;color:#92400e}.empty{text-align:center;color:var(--muted);padding:30px}@media(max-width:680px){.row{display:block}.actions{margin-top:14px}.head{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="head"><div class="brand"><div class="logo">AB</div><div>AutoBüro Freigaben</div></div><button class="soft" id="refresh">Aktualisieren</button></div><div id="status" class="card">Anmeldungen werden geladen…</div><section id="list"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>(function(){'use strict';var c=window.AUTOBURO_CONFIG||{},sb=null,status=document.getElementById('status'),list=document.getElementById('list');if(window.supabase&&c.supabaseUrl&&c.supabaseKey)sb=window.supabase.createClient(c.supabaseUrl,c.supabaseKey);function esc(v){return String(v||'').replace(/[&<>"']/g,function(x){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[x]})}async function load(){if(!sb){status.textContent='Supabase bağlantısı bulunamadı.';return}var s=await sb.auth.getSession();if(!s.data.session){status.textContent='Önce AutoBüro yönetici hesabıyla giriş yapın.';return}var r=await sb.rpc('autoburo_list_signup_requests');if(r.error){status.textContent='Freigabe listesi açılamadı: '+r.error.message;return}var rows=r.data||[];status.textContent=rows.length+' kayıt bulundu.';list.innerHTML='';if(!rows.length){list.innerHTML='<div class="card empty">Bekleyen kayıt yok.</div>';return}rows.forEach(function(x){var el=document.createElement('article');el.className='card';el.innerHTML='<div class="row"><div><strong>'+esc(x.workshop_name||'Werkstatt ohne Namen')+'</strong> <span class="badge">'+esc(x.status)+'</span><div class="meta">'+esc(x.email)+'<br>'+new Date(x.requested_at).toLocaleString('de-DE')+'</div></div><div class="actions"><button class="ok">Freigeben</button><button class="no">Ablehnen</button></div></div>';var buttons=el.querySelectorAll('button');buttons[0].onclick=function(){review(x.user_id,true)};buttons[1].onclick=function(){review(x.user_id,false)};list.appendChild(el)})}async function review(id,approve){if(!confirm(approve?'Bu firmayı onaylıyor musunuz?':'Bu firmayı reddediyor musunuz?'))return;var r=await sb.rpc('autoburo_review_signup',{p_user_id:id,p_approve:approve,p_note:null});if(r.error){alert(r.error.message);return}load()}document.getElementById('refresh').onclick=load;load()})();</script></body></html>
